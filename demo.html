<style>

#combo{color:#ff9e5e;min-width:62px}
canvas{display:block;border-radius:10px}

#msg{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);background:rgba(20,16,12,.92);color:#ffe6b0;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:50}
#panel{position:absolute;inset:0;background:transparent;display:none;align-items:center;justify-content:center;z-index:40}
#panelBox{position:relative;width:min(1120px,94vw);height:min(780px,86vh);display:flex;flex-direction:column;
  background:url(ui/panel.png) center/100% 100% no-repeat;color:#f2ecf6;padding:0 26px 30px}
#panelHead{height:114px;flex:0 0 auto;padding:52px 0 0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#tabs{display:flex;gap:8px;flex:1;align-items:flex-start;padding-left:140px;flex-wrap:nowrap}
#tabs button{border:0 solid transparent;border-width:0 31px;border-image:url(ui/tab_off.png) 0 31 fill stretch;outline:0;
  background:transparent;color:#f3eef7;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap;
  height:62px;line-height:62px;padding:0;position:relative;z-index:1;
  text-shadow:0 1px 2px rgba(18,10,28,.55);
  transition:filter .12s,transform .1s}
#tabs button img{width:23px;height:23px;margin-right:9px;vertical-align:-6px}
#tabs button:hover{filter:brightness(1.12)}
#tabs button:active{transform:translateY(1px)}
#tabs button.on{border-image:url(ui/tab_on.png) 0 31 fill stretch;color:#6b4a33;font-weight:bold;text-shadow:none}
#tabs button.on img{filter:brightness(0) saturate(100%) invert(31%) sepia(18%) saturate(1200%) hue-rotate(340deg) brightness(.8)}
#panelClose{position:absolute;right:14px;top:40px;width:66px;height:68px;border:0;padding:0;cursor:pointer;
  background:url(ui/close.png) center/100% 100% no-repeat;text-indent:-999em;overflow:hidden;z-index:5}

.slot{display:grid;grid-template-columns:repeat(4,161px);justify-content:start;gap:10px;margin:0 0 16px}

.slot .sl[data-add]:hover{filter:brightness(1.12)}
.det{display:flex;gap:14px;position:relative;background:url(ui/card.png) center/100% 100% no-repeat;border-radius:16px;padding:14px 90px 14px 16px;margin:2px 0 6px;min-height:106px}
.detL{flex:0 0 auto;display:flex;align-items:center}

.detN{color:#fff;font-size:15.5px;font-weight:bold;display:flex;align-items:center;gap:9px}
.detN .ry{font-size:11px;color:#a59db8;font-weight:normal}
.detS{color:#ffd978;font-size:14px;letter-spacing:2px;margin-top:2px}
.detS .dim{color:#5f5872}
.detD{color:#b3abc4;font-size:11.5px;margin-top:6px;line-height:1.55}

.detX:hover{filter:brightness(1.06)}
.rw{color:#cfc7dd;font-size:12.5px;line-height:1.95;padding-left:2px}

.rw .tg{color:#8fd6a1;font-size:11px;margin-left:8px}
.rw .lk{color:#77708a;font-size:11px;margin-left:8px}
h4{margin:16px 0 8px;color:#f7d98c;font-size:13px}
#panelBody input[type=range]{accent-color:#d8bd84;vertical-align:-3px;width:110px}

<body>
<div class="plane">
  <h3>键盘猫 demo v3</h3>
  <p>直接打字。猫蹲在某个键上不动，按下它脚下的键就把它击飞，落点键会闪。</p>
  <p style="opacity:.7">图鉴/编队、扭蛋商店、日记、成就、设置，都在面板里用标签页切换。</p>
  <div class="row">
    <button id="bOpen">打开面板</button>
    <button id="bTheme" class="ghost">换键盘</button>
  </div>
  <input type="file" id="fileIn" accept=".json" style="display:none">
</div>
<div id="widget"><div id="bar">
  <span>鱼干 <b id="fish">0</b></span><span>今日 <b id="today">0</b></span><span>总计 <b id="total">0</b></span><span>最高连击 <b id="best">0</b></span><span id="combo"></span>
</div><canvas id="cv"></canvas></div>
<div class="taskbar">（这里假装是任务栏，挂件默认贴着它的顶部、靠右下角）</div>
<div id="msg"></div>
<div id="panel"><div id="panelBox"><div id="panelHead"><div id="tabs"></div><button id="panelClose" class="hdbtn">关闭</button></div><div id="panelBody"></div></div></div>
<script>

const U=36,PAD=10,TOP=72,S=3;
const keys=[],byCode={};
function row(y,x,items){for(const it of items){const code=it[0],label=it[1],w=it[2]===undefined?1:it[2];if(code){const k={code:code,label:label,x:x,y:y,w:w,press:0,flash:0,bounce:0};keys.push(k);byCode[code]=k;}x+=w;}}
const L=function(s){return s.split('').map(function(c){return ['Key'+c,c]})};
row(0,0,[['Backquote','\u0060']].concat('1234567890'.split('').map(function(d){return ['Digit'+d,d]})).concat([['Minus','-'],['Equal','='],['Backspace','Back',2]]));
row(1,0,[['Tab','Tab',1.5]].concat(L('QWERTYUIOP')).concat([['BracketLeft','['],['BracketRight',']'],['Backslash','\\\\',1.5]]));
row(2,0,[['CapsLock','Caps',1.75]].concat(L('ASDFGHJKL')).concat([['Semicolon',';'],['Quote',"'"],['Enter','Enter',2.25]]));
row(3,0,[['ShiftLeft','Shift',2.25]].concat(L('ZXCVBNM')).concat([['Comma',','],['Period','.'],['Slash','/'],['ShiftRight','Shift',2.75]]));
row(4,0,[['ControlLeft','Ctrl',1.25],['MetaLeft','Win',1.25],['AltLeft','Alt',1.25],['Space','',7.5],['AltRight','Alt',1.25],['Fn','Fn',1.25],['ControlRight','Ctrl',1.25]]);
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d');
const W=Math.round(PAD*2+15*U),H=Math.round(TOP+5*U+PAD);
// 高 DPI：物理像素 = CSS 像素 × DPR，再整体缩放，画布保持 1:1 的 CSS 尺寸
const DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1));
cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
cv.style.width=W+'px';cv.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
// 静态层缓存：底板+键帽只在状态变化时重画，其余帧只 blit 一次 + 画猫，省 CPU
const baseCv=document.createElement('canvas');baseCv.width=cv.width;baseCv.height=cv.height;
let baseCtx=baseCv.getContext('2d');baseCtx.setTransform(DPR,0,0,DPR,0,0);
let baseSig='',baseDirty=true;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){baseDirty=true});
function kcx(k){return PAD+(k.x+k.w/2)*U}
function kcy(k){return TOP+(k.y+.5)*U}
function feetY(k){return kcy(k)+9}
function keyAt(x,y){return keys.find(function(k){return x>=PAD+k.x*U&&x<PAD+(k.x+k.w)*U&&y>=TOP+k.y*U&&y<TOP+(k.y+1)*U})||null}

// ---------------- 猫的设定 ----------------
// 特性已全部删除（2026-11-05 用户决定）：升星不再改变操作手感，改给特效。
// ★ 击飞特效 / ★★ 落地动作 / ★★★ 常驻装饰
const SPECIES=[
 {id:'orange',name:'橘猫',rarity:'common',pal:{k:'#2b1d14',o:'#f2a24a',w:'#fff4e6',p:'#ff8fa3',e:'#1a1a1a',t:'#d9822b'},desc:'贪睡，爱蹲空格和 Shift 这种大键',
  fx:{n:'鱼骨雨',c:['#d8bd84','#fff3c4','#e8a44a']},
  land:{n:'打个滚'},aura:{n:'暖橙光晕',c:'rgba(255,190,110,.55)'}},
 {id:'calico',name:'三花',rarity:'common',pal:{k:'#3b302a',o:'#f5ece0',w:'#fffaf2',p:'#ff8fa3',e:'#1a1a1a',t:'#c8722c'},desc:'暴脾气，最容易生气，一生气就去霸占 Enter',
  fx:{n:'裂纹火花',c:['#ff9e5e','#fff0d0','#ff5a5a']},
  land:{n:'歪头摔'},aura:{n:'花瓣描边',c:'rgba(255,168,187,.6)'}},
 {id:'tabby',name:'狸花',rarity:'common',pal:{k:'#23252a',o:'#9aa0a6',w:'#e8e4dc',p:'#ff9db0',e:'#141414',t:'#5c6166'},desc:'胆小，被打完会躲到角落',
  fx:{n:'金色火星',c:['#d8bd84','#fff6cf','#c9a24a']},
  land:{n:'缩成一团'},aura:{n:'金色描边',c:'rgba(255,215,107,.55)'}},
 {id:'white',name:'白猫',rarity:'common',pal:{k:'#3a352e',o:'#f7f4ee',w:'#ffffff',p:'#ff9ab0',e:'#1a1a1a',t:'#dcd5c6'},desc:'讲究，专挑你最近没按过的键',
  fx:{n:'花瓣飘落',c:['#ffd7e4','#fff','#ffb0c8']},
  land:{n:'轻踮脚尖'},aura:{n:'月光白晕',c:'rgba(255,255,255,.6)'}},
 {id:'old',name:'老头',rarity:'common',pal:{k:'#47240b',o:'#f4b96a',w:'#fff5e0',p:'#ff98a8',e:'#1a1a1a',t:'#cf9444'},desc:'老资历，最爱蹲在你最常按的那一排',
  fx:{n:'落叶飘',c:['#e8a44a','#ffd79a','#b87a2e']},
  land:{n:'慢慢趴下'},aura:{n:'暖黄光',c:'rgba(255,214,140,.5)'}},
 {id:'cheese',name:'起司',rarity:'common',pal:{k:'#462616',o:'#fffdf7',w:'#ffffff',p:'#ffa8bb',e:'#1a1a1a',t:'#c8b7ad'},desc:'浅灰虎斑，安静，几乎不生气',
  fx:{n:'奶泡爆开',c:['#fff','#f2e4d8','#c8b7ad']},
  land:{n:'软绵绵塌下'},aura:{n:'浅灰描边',c:'rgba(200,183,173,.55)'}},
 {id:'black',name:'黑猫',rarity:'rare',pal:{k:'#1a1720',o:'#3a3640',w:'#4a4552',p:'#ff8fa3',e:'#d8bd84',t:'#22202a'},desc:'落地时炸开一圈暗影，按错只是扑空',
  fx:{n:'暗影裂开',c:['#8f7ce8','#2b2440','#d3c8ff']},
  land:{n:'侧空翻'},aura:{n:'紫黑拖尾',c:'rgba(160,140,255,.5)'}},
 {id:'siamese',name:'暹罗',rarity:'rare',pal:{k:'#2f2622',o:'#e8dcc8',w:'#f6efe2',p:'#ff9db0',e:'#1a1a1a',t:'#4a3a34'},desc:'重点色最讲究的一只，落地总是很轻',
  fx:{n:'奶泡爆开',c:['#fff8ea','#e8d4b8','#5c4030']},
  land:{n:'优雅落地'},aura:{n:'深棕面罩光',c:'rgba(150,110,80,.55)'}},
 {id:'cow',name:'奶牛猫',rarity:'rare',pal:{k:'#22201e',o:'#f4f1ea',w:'#ffffff',p:'#ff9ab0',e:'#1a1a1a',t:'#2e2b2b'},desc:'好动，落地爱翻滚，一天到晚闲不下来',
  fx:{n:'黑白墨点',c:['#fff','#3a3a3a','#c9c9c9']},
  land:{n:'四脚朝天'},aura:{n:'奶斑光圈',c:'rgba(240,240,240,.55)'}},
 {id:'sheriff',name:'警长',rarity:'rare',pal:{k:'#452716',o:'#fffdf7',w:'#ffffff',p:'#ffa8bb',e:'#1a1a1a',t:'#7d7672'},desc:'燕尾服，落地讲究，喜欢踩正中间的 G 和 H',
  fx:{n:'月光落地',c:['#dfe9ff','#fff','#9fb8e8']},
  land:{n:'立正'},aura:{n:'银色披风',c:'rgba(200,215,245,.55)'}},
 {id:'ghost',name:'幽灵猫',rarity:'ghost',pal:{k:'rgba(150,190,255,.45)',o:'rgba(196,224,255,.5)',w:'rgba(240,250,255,.6)',p:'rgba(255,170,200,.6)',e:'rgba(255,235,140,.9)',t:'rgba(150,190,255,.4)'},desc:'蹲着时几乎透明，只有脚下的键在发光',
  fx:{n:'幽蓝雾气',c:['#bfe4ff','#eaf7ff','#7fb0e8']},
  land:{n:'飘一下'},aura:{n:'幽灵拖影',c:'rgba(190,225,255,.6)'}}
];
const SPEC={};SPECIES.forEach(function(s){SPEC[s.id]=s});
const RARITYNAME={common:'常见',rare:'稀有',ghost:'幽灵'};

// ---------------- 存档 ----------------
const SK='kbcat.v2';
function defaults(){return{fish:0,total:0,best:0,days:{},lastReport:null,owned:{orange:1},equipped:['orange'],items:{},catDay:'',catToday:0,fishToday:0,acc:{},ach:{},relay:0,chain:0,catSize:44,vol:{key:.25,cat:.6,ui:.5},theme:'wood',privacy:false,auto:false,onlyAlpha:false,noLand:{Fn:1},noHide:false}}
let store=defaults();
try{const raw=localStorage.getItem(SK);if(raw)store=Object.assign(defaults(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(store))}catch(e){}renderCount()}
const dkey=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const TODAY=dkey(new Date());
function dayRoll(){
 if(store.catDay!==TODAY){store.catDay=TODAY;store.catToday=0;store.fishToday=0}
}

// ---------------- 主题 ----------------
const THEMES=[
 {id:'wood',name:'木纹',cap:'#8a6a48',capLit:'#c79a68',board:'#453524',edge:'#2d2115',board2:'#54402b',tint:'rgba(58,46,34,.34)'},
 {id:'cyber',name:'赛博',cap:'#2b3550',capLit:'#5d7bd0',board:'#181c26',edge:'#0c0e14',board2:'#212530',tint:'rgba(40,46,60,.40)'},
 {id:'retro',name:'复古',cap:'#cfc3a5',capLit:'#f0e6c8',board:'#5c5343',edge:'#3b3529',board2:'#6a604d',tint:'rgba(96,88,72,.34)'},
 {id:'glow',name:'夜光',cap:'#243044',capLit:'#59d3c8',board:'#141a22',edge:'#0a0d12',board2:'#1c232c',tint:'rgba(30,40,48,.46)'},

function tone(freq,dur,type,vol,slide){const a=ac();if(!a)return;const t=a.currentTime;const o2=a.createOscillator(),g=a.createGain();
 o2.type=type||'sine';o2.frequency.setValueAtTime(freq,t);if(slide)o2.frequency.exponentialRampToValueAtTime(Math.max(40,freq*slide),t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o2.connect(g);g.connect(a.destination);o2.start(t);o2.stop(t+dur+.02)}
// 按键音：真实键盘声（噪声击打 + 带通塑形 + 键帽触底闷响），不再用音高提示
let NOISE=null;
function noiseBuf(a){if(NOISE)return NOISE;const n=Math.max(1,Math.floor(a.sampleRate*.09));
 const b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.6);
 NOISE=b;return NOISE}
function sndKey(k){
 const a=ac();if(!a)return;if(a.state==='suspended')a.resume();
 const t=a.currentTime,v=store.vol.key;
 const row=k&&typeof k.y==='number'?k.y:2;
 // ① 击打：白噪声过带通（上排亮、下排闷），1~2ms 起振，40ms 衰减
 const src=a.createBufferSource();src.buffer=noiseBuf(a);
 const bp=a.createBiquadFilter();bp.type='bandpass';
 bp.frequency.value=(row<=1?3800:row<=3?2900:2300)+Math.random()*260;bp.Q.value=1.2;
 const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;
 const g=a.createGain();
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(Math.max(.002,v*.55),t+.0015);
 g.gain.exponentialRampToValueAtTime(.0001,t+.042);
 src.connect(bp);bp.connect(hp);hp.connect(g);g.connect(a.destination);
 src.start(t);src.stop(t+.06);
 // ② 触底：短促低频闷响，给一点"实心"的重量
 const o=a.createOscillator(),og=a.createGain();
 o.type='sine';o.frequency.setValueAtTime(175+Math.random()*35,t);
 o.frequency.exponentialRampToValueAtTime(88,t+.05);
 og.gain.setValueAtTime(Math.max(.001,v*.22),t);
 og.gain.exponentialRampToValueAtTime(.0001,t+.062);
 o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+.08)}

function registerHit(c,k,relay){

 sp.n=sp.k===spotKey?(sp.n||0)+1:1;sp.k=spotKey;
 if(sp.n>10)gain=Math.max(1,Math.round(gain/2));

 burst(x,y,fx?16:12,fx?fx.c:['#fff','#ffe27a','#ffd0a0'],fx?300:260);

 // 撞猫连锁已由 chainStrike 处理
}

function press(code,repeat){

function updateCat(c,dt){

  break;

 case'fly':{const f=c.fly;f.t+=dt/f.dur;
  const t=Math.min(1,f.t);c.x=f.sx+(f.ex-f.sx)*t;c.y=f.sy+(f.ey-f.sy)*t-4*f.h*t*(1-t);

   if(stars(c.pid)>=2){c.landT=.34;c.sq=.26;const ac2=SPEC[c.pid].aura.color||SPEC[c.pid].aura.c;

   c.state='dizzy';c.timer=1.0;c.alpha=1;c.fly=null;c.landedAt=now;
   chainStrike(c);
   break}
  break}
  case'dizzy':c.timer-=dt;if(c.timer<=0){c.state='guard';c.timer=rand(.8,1.6)}break}
}

const CATPOOL=['orange','calico','tabby','white','old','cheese','black','siamese','cow','sheriff','ghost'];
const RATES={orange:.16,calico:.15,tabby:.13,white:.12,old:.11,cheese:.10,
             black:.08,siamese:.06,cow:.05,sheriff:.03,ghost:.01};
const CATTHRESH=300;    // 当天鱼干达到这个数，解锁第二次
function catDone(){return CATPOOL.every(function(id){return (store.owned[id]||0)>=3})}
function catQuota(){return store.catToday||0}
function catLeft(){
 if(catDone())return 0;
 return Math.max(0,2-catQuota());
}
function catCost(){
 // 返回 {free:bool, cost:number, locked:string|null}
 if(catDone())return{free:false,cost:0,locked:'猫池已抽满，等后续更新'}
 if(catQuota()===0)return{free:true,cost:0,locked:null};
 if(catQuota()>=2)return{free:false,cost:0,locked:'今天已经抽过 2 次了'};
 const f=store.fishToday||0;
 if(f<CATTHRESH)return{free:false,cost:0,locked:'今天还差 '+(CATTHRESH-f)+' 鱼干解锁第二次'};
 return{free:false,cost:0,locked:null};
}
function rollCat(){
 let pool=CATPOOL.map(function(id){return{id:id,w:RATES[id]}});
 pool=pool.filter(function(p){return (store.owned[p.id]||0)<3});
 if(!pool.length)return CATPOOL[0];
 const total=pool.reduce(function(a,b){return a+b.w},0);let r=Math.random()*total;
 for(const p of pool){r-=p.w;if(r<=0)return p.id}
 return pool[0].id}
function doGachaCat(){
 if(!store.owned){store.owned={}}
 const q=catCost();
 if(q.locked){msg(q.locked);return}
 store.catDay=TODAY;store.catToday=(store.catToday||0)+1;
 const pid=rollCat();
 const before=store.owned[pid]||0;
 store.owned[pid]=Math.min(3,before+1);
 if(store.owned[pid]>=3&&before>=3){} 
 if(before>=3){store.fish+=10;msg('满星重复，折 10 鱼干')}
 else if(before===0){msg('抽到新猫：'+SPEC[pid].name)}
 sndGacha();save();checkAch();
 panelGacha('<div class="card" style="max-width:260px;margin:10px auto;text-align:center"><div class="n" style="font-size:18px">'+SPEC[pid].name+'</div><div class="p">'+('★'.repeat(store.owned[pid]))+'</div><div class="s">'+(before?'重复，升一星':'新猫!')+'</div></div>');
}
function panelGacha(result){
 dayRoll();
 const q=catCost();
 const canDraw=!q.locked;
 const label=q.locked?q.locked:(q.free?'免费抽一次':'抽第二次（今日鱼干 '+Math.min(CATTHRESH,store.fishToday||0)+'/'+CATTHRESH+'）');
 paint('gacha',
  (result||'')+
  '<h4>猫池</h4><div class="tip2">每天免费一次；当天击飞攒够 '+CATTHRESH+' 鱼干再解锁一次，每天最多 2 次。抽到重复的猫升一星，满 3 星后重复折 10 鱼干。猫池抽满会自动关闭。</div>'+
  '<div class="tip2" style="color:#c9bfa8">今日已抽 '+catQuota()+'/2 · 今日鱼干 '+Math.min(CATTHRESH,store.fishToday||0)+'/'+CATTHRESH+'</div>'+
  '<button id="g1" '+(canDraw?'':'disabled')+' style="padding:7px 16px;border:0;border-radius:8px;background:'+(canDraw?'#d8bd84':'rgba(255,255,255,.10)')+';color:'+(canDraw?'#2b1d14':'#8f8aa0')+';cursor:'+(canDraw?'pointer':'default')+';font-family:inherit;font-weight:bold">'+label+'</button>'+
  (ACC_ON?'<h4>杂货池</h4><div class="tip2">60 鱼干一次。只出精良款饰品（商店只卖普通款），抽齐后会提示。</div>'+
  '<button id="g2" style="padding:7px 16px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font-family:inherit">抽杂货（60 鱼干）</button>':'')+
  '<div style="margin:22px 0 0;border-top:1px solid #332e42;padding-top:4px"></div>'+
  shopHTML()+
  '');
 document.getElementById('g1').onclick=function(){doGachaCat()};

  if(!fresh.length){msg('杂货已经抽齐了');return}
  store.fish-=60;const it=pick(fresh);store.items[it.id]=true;sndGacha();save();

function simulate(seconds,aim){
 aim=aim||.7;
 const step=1/60,n=Math.round(seconds*60);let presses=0,relays=0,hits=0;
 const oldReg=registerHit;
 for(let i=0;i<n;i++){
  now+=step;
  if(i%9===0){
   const c=cats[i%cats.length];
   let code;
   if(c&&c.state==='fly'&&c.fly&&Math.random()<aim)code=c.fly.toKey.code;
   else if(c&&c.key&&Math.random()<aim)code=c.key.code;
   else{const near=keys.filter(function(k){return c&&Math.hypot(kcx(k)-c.x,kcy(k)-c.y)<4*U});code=pick(near.length?near:keys).code}
   const before=store.total;
   press(code,false);release(code);presses++;
   if(store.total>before)hits++;
  }
  update(step);
 }
 return {seconds:seconds,presses:presses,hits:hits,total:store.total,fish:store.fish,best:store.best,cats:cats.map(function(c){return c.pid+':'+c.state})}
}

 ok('手动划出的键不再落点',bad2===0,bad2+'/'+200);
 store.onlyAlpha=true;
 let bad3=0;for(let i=0;i<100;i++){const t=pickLanding(c0,null);if(!ALPHA_CODES[t.code])bad3++}
 ok('两个开关同时生效',bad3===0,bad3+'/100');
 store.onlyAlpha=false;store.noLand={Fn:1};
 // 编队：点图鉴上阵（从左到右填空位）、点编队下阵
 store.owned={orange:1,tabby:1,cow:1,black:1};store.equipped=['orange'];equipCats();
 try{panelDex();
  const cardEl=panelBody.querySelector('[data-cat="tabby"]');cardEl.onclick();
  ok('点图鉴按顺序上阵',store.equipped.join(',')==='orange,tabby',store.equipped.join(','));
  panelDex();panelBody.querySelector('[data-cat="cow"]').onclick();
  ok('再点一只填到第三位',store.equipped.join(',')==='orange,tabby,cow',store.equipped.join(','));
  panelDex();
  ok('编队上限 8 只、空位 5 个',panelBody.querySelectorAll('.sl[data-add]').length===MAXC-3,panelBody.querySelectorAll('.sl[data-add]').length);
  store.equipped=['orange','calico','tabby','white','old','cheese','black','siamese'];
  store.owned={orange:1,calico:1,tabby:1,white:1,old:1,cheese:1,black:1,siamese:1};
  equipCats();panelDex();
  ok('8 只同时在场的场上猫数',cats.length===8,cats.length);
  ok('8 只站位互不重复',new Set(cats.map(function(c){return c.key.code})).size===8,cats.map(function(c){return c.key.code}).join(','));
  const emptySlots=panelBody.querySelectorAll('.sl[data-add]').length;
  ok('编队满 8 只时不再显示空位',emptySlots===0,emptySlots);
  panelBody.querySelector('.sl.on').onclick();
  ok('点编队里的猫就下阵',store.equipped.length===7,store.equipped.length);
  panelDex();
  ok('下阵后出现 + 空位',panelBody.querySelectorAll('.sl[data-add]').length===1,panelBody.querySelectorAll('.sl[data-add]').length);
  ok('点编队不再弹出选择界面',panelBody.textContent.indexOf('清空这个位')<0,'');
 }catch(e){ok('编队交互',false,e.message)}
 store.equipped=['orange'];equipCats();
 // 设置页：Ctrl+Alt 点键才改落点范围
 try{panelSet();
  const kBtn=panelBody.querySelector('[data-land="Space"]');
  const fake={ctrlKey:false,altKey:false};
  kBtn.onclick(fake);
  ok('不按 Ctrl+Alt 点键不改范围',!store.noLand['Space'],JSON.stringify(store.noLand));
  kBtn.onclick({ctrlKey:true,altKey:true});
  ok('按住 Ctrl+Alt 点键可划出',!!store.noLand['Space'],JSON.stringify(store.noLand));
  panelBody.querySelector('[data-land="Space"]').onclick({ctrlKey:true,altKey:true});
  ok('再点一次恢复',!store.noLand['Space'],JSON.stringify(store.noLand));
 }catch(e){ok('落点范围按钮',false,e.message)}
 // 本轮 UI 修正
 try{panelGacha();
  const caps=panelBody.querySelectorAll('.card.theme .cap img');
  ok('主题卡都有预览图',caps.length===THEMES.length,caps.length+'/'+THEMES.length);
  ok('预览图路径正确',Array.prototype.every.call(caps,function(im){return im.getAttribute('src')==='ui/th_'+im.closest('.card').dataset.use+'.png'}),'');
  const tb=document.querySelector('#tabs button');
  const cs=getComputedStyle(tb);
  ok('标签按钮没有投影',cs.boxShadow==='none'||!cs.boxShadow,cs.boxShadow);
  ok('标签按钮没有立体文字',getComputedStyle(document.querySelector('#tabs button.on')).textShadow==='none',getComputedStyle(document.querySelector('#tabs button.on')).textShadow);
 }catch(e){ok('主题预览',false,e.message)}
 try{panelDex();
  const c=panelBody.querySelector('.card');
  const dt=c.querySelector('.dt'),eq=c.querySelector('.eq');
  const h1=parseFloat(getComputedStyle(dt).height),h2=parseFloat(getComputedStyle(eq).height);
  ok('详情按钮与上阵中同高',Math.abs(h1-h2)<=1.5,h1+'/'+h2);
  const cards=[].slice.call(document.querySelectorAll('#panelBody .card'));
  // 高度改成 min-height 自适应后，按行分组比较（同一行必须一样高，不同行可以不同）
  const rows={};
  cards.forEach(function(x){const b=x.getBoundingClientRect();const k=Math.round(b.top);(rows[k]=rows[k]||[]).push(b.height)});
  let rowBad='';
  Object.keys(rows).forEach(function(k){const hs=rows[k];if(hs.length>1&&Math.max.apply(null,hs)-Math.min.apply(null,hs)>1.5)rowBad+='y'+k+'='+hs.map(Math.round).join('/')+' '});
  ok('同一行猫咪卡片高度一致',cards.length>4&&!rowBad,rowBad||(cards.length+' 卡 / '+Object.keys(rows).length+' 行'));
  ok('卡片描述只留两行',getComputedStyle(c.querySelector('.s')).webkitLineClamp==='2',getComputedStyle(c.querySelector('.s')).webkitLineClamp);
 }catch(e){ok('卡片尺寸',false,e.message)}
 store.noLand={Fn:1};store.onlyAlpha=false;save();
 return log;
}

if(location.hash==='#test'){setTimeout(function(){try{document.title=JSON.stringify(selfTest())}catch(e){document.title='THROW '+e.message+' @'+(e.stack||'').split('\n')[1]}},50)}
